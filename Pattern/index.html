<!DOCTYPE html>
<html lang="en">
<head>

    <title>Pattren</title>
</head>
<body>
    <div background-color:blue>
    <center> 
    <form action="./index1.html">
        <h1>Pattren for Phone number</h1>
        <label for="">Phone no:-</label>
        <input type="" placeholder="Enter Phone no" pattern="\+91\s[6-9][0-9]{9}$" required><br>
        <br>        
        <button>Submit</button>
    </form>
    <form action="./index1.html">
        <h1>Pattren for Email</Em></h1>
        <label for="">Email:-</label>
        <input type="email" placeholder="Enter Email no" pattern="[a-z0-9!@#$%^&*()]+@gmail.[a-z]{2,3}" required><br>
        <br>        
        <button>Submit</button>
    </form>
    <form action="./index1.html">
        <h1>Pattren for Password</Em></h1>
        <label for="">Password:-</label>
        <input type="text" placeholder="Enter Password" pattern="^(?=.*[a-z])(?=.*[A-z])(?=.*[0-9])(?=.*[@$!%*?&]).{8,16}$" required><br>
        <br>        
        <button type="submit">Submit</button>
    </form>

</center>  
        </div>
</body>
